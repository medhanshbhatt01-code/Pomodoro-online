<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
</head>
<body>
     <div class="app">

       <header class="topbar">

        <div class="nameholder">

                Pomodoro Timer

            </h1>

            <div class="streakcount">0</div>

        </div>    

        </div>

        <div class="features">
            <button class="darkmode">
                <svg class="moon"
                    xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="#ffffff" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                    class="theme-toggle-icon"
                    >
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>

               <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    
                    <circle cx="12" cy="12" r="4"></circle>
                    
                    
                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="M4.93 4.93l1.41 1.41"></path>
                    <path d="M17.66 17.66l1.41 1.41"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>
                    <path d="M6.34 17.66l-1.41 1.41"></path>
                    <path d="M19.07 4.93l-1.41 1.41"></path>

                </svg>

            </button>

            <button class="task">

                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="#ffffff" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                    class="icon-tasks"
                    >
                    <rect x="3" y="3" width="6" height="6" rx="1"></rect>
                    <path d="m3 17 2 2 4-4"></path>
                    <line x1="13" y1="6" x2="21" y2="6"></line>
                    <line x1="13" y1="12" x2="21" y2="12"></line>
                    <line x1="13" y1="18" x2="21" y2="18"></line>
                </svg>

            </button>

            <button class="report">

                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="#ffffff" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                    class="icon-chart"
                    >
                    <!-- Chart Axes / Framework -->
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>

            </button>

            <button class="music">

                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="#ffffff" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                    class="icon-music"
                    >
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>

            </button>
            
        </div>

       </header>
        <main class="main">

            <section class="mode">

                <div class="selector">

                </div>

                <button class="focus">
                Focus
                </button>

                <button class="shortbreak">
                Short break
                </button>

                <button class="longbreak">
                Long break
                </button>
 
            </section>
             
            <section class="timercontainer">

               

                <svg class="circle">

                    <circle class="timer"
                        r="150"
                        cx="190"
                        cy="170">

                    </circle>

                    <circle class="timer2"
                     class="timer"
                        r="150"
                        cx="190"
                        cy="170">
                    
                    </circle>

                    <text class="text" x="190" y="170">
 
                    </text>

                </svg>

            </section>

            <section class="startstop">

                <button class="stop">

                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="#ffffff" 
                    stroke-width="2.5" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                    >
                    <rect x="5" y="5" width="14" height="14" rx="3.5"></rect>
                </svg>

                </button>

                <button class="start">Start
                 
                </button>

                <button class="pause">⏸Pause

                </button>

                <button class="pop">

               <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="#ffffff" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                    >
                    <rect x="2" y="4" width="16" height="11" rx="3"></rect>
                    <rect x="11" y="11" width="11" height="8" rx="2.5"></rect>
                </svg>

                </button>

            </section>

        </main>

        <footer class="footer">

            <span class="quote">


            </span>
        </footer>

      
     
        <aside class="musicpanel">
            <h3 class="ambient">Ambient sound</h3>

            <div class="track-list">

                <div class="track-item">

                    <button class="music-play-button" data-audio="audio-rain">

                        <div class="toggle"></div>

                    </button>

                    <span class="track-title">Music 1</span>
                    
                </div>

                <div class="track-item">

                    <button class="music-play-button" data-audio="audio-whitenoise">

                        <div class="toggle"></div>

                    </button>

                    <span class="track-title">Music 2</span>
                    
                </div>

                <div class="track-item">

                    <button class="music-play-button" data-audio="audio-waves">

                        <div class="toggle"></div>

                    </button>

                    <span class="track-title">Music 3</span>
                    
                </div>

                <div class="track-item">

                    <button class="music-play-button" data-audio="audio-forest">

                        <div class="toggle"></div>

                    </button>

                    <span class="track-title">Music 4</span>
                    
                </div>

                <div class="track-item">

                    <button class="music-play-button" data-audio="audio-cafe">

                        <div class="toggle"></div>
                        
                    </button>

                    <span class="track-title">Music 5</span>
                    
                </div>

                
            </div>
        </aside>

        

        <aside class="switch">
            <div class="disclaimer">Abandon this focus session?</div>
            <div class="info">This pomodoro won't count as a session, but your focused minutes are saved — your break starts right away.</div>
            <button class="cancel">Cancel</button>
            <button class="confirm">Switch</button>

        </aside>

        


     </div>
                      





    <script src="logic.js"></script>
    <audio id="audio-rain" src="elarialuthien-music-for-sleep-night-in-the-rainy-tropics-with-birds-singing-239830.mp3" loop preload="none"></audio>
    <audio id="audio-whitenoise" src="konstantinpazuzustudio-baby-fireflies-489467.mp3" loop preload="none"></audio>
    <audio id="audio-waves" src="atlasaudio-relax-relax-music-576654.mp3" loop preload="none"></audio>
    <audio id="audio-forest" src="konstantinpazuzustudio-healing-water-piano-and-rain-495274.mp3" loop preload="none"></audio>
    <audio id="audio-cafe" src="musicword-moonlit-night-320134.mp3" loop preload="none"></audio>
</body>
</html>
